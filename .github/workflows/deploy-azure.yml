name: Deploy ProblemHunt static app

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Deploy reviewed main build; database compatibility was verified separately'
        required: true
        type: boolean
        default: false

concurrency:
  group: problemhunt-static-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  FRONTEND_PATH: problem-hunt
  AZURE_RESOURCE_GROUP: problemhunt

jobs:
  test:
    uses: ./.github/workflows/frontend-tests.yml

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release == true
    runs-on: ubuntu-latest
    name: Deploy static app
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select reviewed existing Static Web App
        env:
          REVIEWED_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
        run: |
          set -euo pipefail
          test -n "$REVIEWED_APP_NAME" || { echo "Set AZURE_STATIC_WEB_APP_NAME to the reviewed existing resource"; exit 1; }
          echo "STATIC_WEB_APP_NAME=$REVIEWED_APP_NAME" >> "$GITHUB_ENV"
      - name: Fetch Static Web App deployment token
        id: fetch-token
        run: |
          set -euo pipefail
          SWA_TOKEN=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.apiKey" --output tsv)
          echo "::add-mask::$SWA_TOKEN"
          echo "token=$SWA_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          NODE_ENV: production
        run: npm run build

      - name: Deploy static app
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.fetch-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ env.FRONTEND_PATH }}/dist
          output_location: ''
          skip_app_build: true
